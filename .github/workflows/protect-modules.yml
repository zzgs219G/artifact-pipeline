name: APK加固-模块勾选

# 勾选式统一入口（schema 驱动动态配置版）：
#   App 拉取 configs/v1/config-schema.json 生成父子级勾选 UI → 生成 protect_config
#   JSON → dispatch 传入 → scripts/actions/resolve-config.py 按 schema 解释成
#   protect.sh 参数（schema_rules/args.txt，一行一个）→ 执行。
#   加新模块/子选项只改 configs/v1/config-schema.json 一份文件（App 与本 yml 零改动）。
# 执行顺序由 protect.sh 固定为
#   签名校验 → Dex2C(唯一转译引擎) → 字符串加密 → 防对比混淆(anti-diff) → 环境检测(envcheck) → 基础加壳(packer)
#   （anti-diff 是 dex 层结构噪声,放 stringenc 后;加壳必须最后，加了壳其它模块改不动）
# GitHub 网页兜底：不勾任何模块时可直接在 protect_config 手填 JSON（见 configs/v1/config-schema.json）。

on:
  # push 触发：只跑 test job（回归检查）。protect job 会被 job 级 if 挡住——
  # 它是 workflow_dispatch 专用（需要 apk_url / protect_config 必填输入）。
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'configs/**'
      - 'docs/**'
      - '.github/**'
      - '*.md'
  # PR 也跑一遍：避免直接推 main 前的改动没被检查过
  pull_request:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'configs/**'
      - 'docs/**'
      - '.github/**'
      - '*.md'
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'APK下载链接(需已用开发者keystore签名)'
        required: true
      protect_config:
        description: '加固配置JSON(schema驱动;结构见 configs/v1/config-schema.json)'
        required: true
      dpt_extra_args:
        description: '附加 dpt.jar 参数,空格分隔,如 --smaller(自由文本只构成打包参数注入面,最坏打包失败;secrets 不经此路径)'
        required: false
        default: 
      sign:
        description: '是否签名产物（true=用 KEYSTORE_BASE64 对应的 keystore 重签，产出可直接安装；默认 false=保持"未签名"契约）'
        required: false
        type: boolean
        default: false

jobs:
  # ── 秒级回归（2026-11-01 新增）────────────────────────────────────
  # 为什么需要：CI 此前【一个测试都不跑】，只做构建。代价已经付过——
  #   test-workflow-yml.sh（10-31 加 sign input 未同步断言）与
  #   check-schema.py（10 月删 dcc 模块未同步断言）两个测试红了几个月，
  #   没有任何人知道，因为没有任何机器在跑它们。
  # AGENTS.md 写着"文字警告防不住文本级重写，只有回归测试能"——但前提是
  # 测试真的在跑。本 job 补上这一环。
  #
  # 本 job 只放【秒级、零外部依赖】的检查，成本几乎为零：
  #   不装 NDK / 不装 java / 不 clone nox，跑完 <10s。
  # 重型套件（so-lock/stringenc/javacheck 等 11 分钟）见 AGENTS.md 的待办，
  # 需要 clone nox 仓库才能跑，另行安排。
  #
  # 与 protect 并行，不拖慢出包。
  test:
    runs-on: ubuntu-24.04
    # 第一批（秒级检查）+ 第二批（stringenc/anti-diff/packer，本地实测约 4 分钟）
    # 留 2 倍余量：CI runner 比本地 Termux 慢，首次还要下载依赖。
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 改个文档也跑全套检查没意义，但【文档检查本身必须跑】——
      # 它校验的就是文档里的路径是否还存在，正是文档改动的把关点。
      - name: 检测改动范围
        id: scope
        uses: dorny/paths-filter@v3
        with:
          filters: |
            docs:
              - 'docs/**'
              - '*.md'
            code:
              - 'scripts/**'
              - 'configs/**'
              - 'tools/**'
              - '.github/**'

      # ── 环境准备：与 protect job 共用同一个 composite action ────────
      # 用户口径："检查的环境和构建脚本环境一样不就好了" —— 对，而且不该靠
      # 手工抄。最初这个 job 是照 protect job 抄的，结果连续 5 次 CI 红，
      # 全是抄漏/抄错（漏 pip 依赖、漏解压 dex2c、抄了个不存在的 nox tag）。
      # 现在两边都 uses ./.github/actions/setup-toolchain，只有一份真相。
      #
      # nox-ref 用 main 而不是某个 tag：nox 最新 tag 是 v0.4.0，它【早于】
      # 修复 nc_guard_jni 缺失的那个提交（1f1a732），锁 v0.4.0 等于测旧代码。
      # 之前我凭 tools/nox/VERSION 里的 "v0.4.2" 想当然写了 ref: v0.4.2，
      # 而 nox 仓库根本没有这个 tag —— checkout 直接失败。
      # 教训：写 ref 前必须 `git tag -l` 核实，不能凭版本文件猜。
      - name: 准备工具链（与出包 job 同一套）
        if: steps.scope.outputs.code == 'true'
        uses: ./.github/actions/setup-toolchain
        with:
          ndk-version: r27d
          nox-source: 'true'   # so 层测试要 nox 源码形态
          nox-ref: main

      - name: 文档路径有效性（改文档必跑）
        if: steps.scope.outputs.docs == 'true'
        run: python3 scripts/actions/tests/test-docs-paths.py

      - name: schema 结构自检
        if: steps.scope.outputs.code == 'true'
        run: python3 scripts/actions/check-schema.py configs/v1/config-schema.json

      - name: schema 解释器回归（37 用例）
        if: steps.scope.outputs.code == 'true'
        run: python3 scripts/actions/tests/test-resolve-config.py

      - name: workflow yml 结构自检
        if: steps.scope.outputs.code == 'true'
        run: bash scripts/actions/tests/test-workflow-yml.sh

      - name: smali 参数槽计数
        if: steps.scope.outputs.code == 'true'
        run: bash scripts/lib/tests/test-smali-params.sh

      - name: dex 版本头 save/restore
        if: steps.scope.outputs.code == 'true'
        run: bash scripts/repack/tests/test-patch-dex-version.sh

      # inject-loadlib 是冻结模块，历史上出过 14 次事故（53 条报错里最多），
      # 却一直没有独立测试。纯 stdlib，秒级，无外部依赖。
      - name: inject-loadlib 插桩（69 断言，纯 stdlib）
        if: steps.scope.outputs.code == 'true'
        run: python3 scripts/inject/tests/test_inject_loadlib.py

      # mark-native 同为冻结模块，历史 11 次事故（报错十/十三/三十九），
      # 此前只有 test-javacheck 的 [5b/9] 间接覆盖"native 壳跳过注入"一个点。
      - name: mark-native 壳替换（42 断言，纯 stdlib）
        if: steps.scope.outputs.code == 'true'
        run: python3 scripts/repack/tests/test_mark_native.py

      # ── 第二批（2026-11-01）：中等耗时，仍【不需要 nox / NDK】──────
      # 这些套件只依赖 JDK + 仓库内已入库的工具（apktool.jar / d8.jar），
      # 本地实测合计约 4 分钟。放进来能覆盖 dex 层与加壳层的回归，
      # 而 Bug 1/Bug 2 那类"构建绿装机崩"的事故面主要在 stringenc/packer。
      - name: anti-diff 冒烟（含报错三十一~四十一回归）
        if: steps.scope.outputs.code == 'true'
        run: bash scripts/anti-diff/tests/test-smoke.sh

      - name: dex 容量检测（33 断言，含报错五十九回归）
        if: steps.scope.outputs.code == 'true'
        run: python3 scripts/repack/tests/test_dex_capacity.py

      - name: packer 冒烟（26 项，含 schema→arg 契约）
        if: steps.scope.outputs.code == 'true'
        run: bash scripts/packer/tests/test-packer.sh

      - name: stringenc 冒烟（27 断言 + apktool 真汇编）
        if: steps.scope.outputs.code == 'true'
        run: bash scripts/string-enc/tests/test-encrypt-smoke.sh

      - name: stringenc 续跑 + 桩结构不变量
        if: steps.scope.outputs.code == 'true'
        run: bash scripts/string-enc/tests/test-structure-resume.sh

      - name: stringenc 桩随机化（6 断言组）
        if: steps.scope.outputs.code == 'true'
        run: bash scripts/string-enc/tests/test-stub-randomize.sh

      - name: stringenc 密钥流双端对拍（468 例）
        if: steps.scope.outputs.code == 'true'
        run: bash scripts/string-enc/tests/test-keystream-crosscheck.sh

      - name: stringenc↔dex2c 联动端到端（7 断言）
        if: steps.scope.outputs.code == 'true'
        run: bash scripts/string-enc/tests/test-link-dex2c.sh

      # ── 第三批（2026-11-01）：so 层与签名校验，需要 nox 源码 / clang ──
      # 这批覆盖 Bug 1 那类"so 侧缺实现导致装机闪退"的事故面，
      # 也是历史上唯一靠真机才能发现的地方 —— 现在至少有宿主端断言兜底。
      - name: so 段加密设施（52 项，读 ../nox 源码）
        if: steps.scope.outputs.code == 'true'
        run: bash scripts/lib/tests/test-so-lock.sh

      - name: sig_guard2 派生对拍
        if: steps.scope.outputs.code == 'true'
        run: bash scripts/sigcheck/tests/test-sig-guard2.sh

      - name: env_mem_readable 跨映射判定
        if: steps.scope.outputs.code == 'true'
        run: bash scripts/sigcheck/tests/test-mem-readable.sh

      - name: LSGS 特征串密文化（12 断言）
        if: steps.scope.outputs.code == 'true'
        run: bash scripts/sigcheck/tests/test-lsgs-strings.sh

      # ⚠️ test-sig-verify.sh 未接入：它需要一份【已签名的真实 APK】作为夹具，
      # 而 CI 干净树里没有。该脚本在没有 APK 时是 `skip + exit 0`——
      # 接进来等于"0 通过 0 失败"，是假绿，比不接更糟。
      # 待办：把一份小体积已签名 APK 作为夹具入库（<200KB），再接入。
      # 见 AGENTS.md「冻结资产的能力边界」。

  protect:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    # 只在手动触发（workflow_dispatch）时出包。
    # push / pull_request 只跑上面的 test job —— 它们没有 apk_url 与 protect_config，
    # 跑 protect 会因必填输入为空直接失败，变成无意义的红叉。
    if: github.event_name == 'workflow_dispatch'
    env:
      R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
      R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_PUBLIC_DOMAIN: ${{ secrets.R2_PUBLIC_DOMAIN }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 环境准备与 test job 共用同一个 composite action（唯一真相）。
      # 曾经这里是 5 个手写步骤、test job 又抄了一遍，导致两边漂移
      # （test 漏了 pip 依赖与 dex2c 解压，连续 5 次 CI 红）。
      # 出包不需要 nox 源码形态（只用 tools/nox.zip 的静态库），故 nox-source=false。
      - name: 准备工具链
        id: toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          ndk-version: r27d
          nox-source: 'false'

      - name: 解析 protect_config（schema 驱动 → protect.sh 参数）
        env:
          # 经 env 中转，用户输入不直接插值进 shell（命令注入面，沿用旧 yml 思路）
          # input 键名 protect_config 为永久冻结名（设计方案 §10.7）
          INPUT_PROTECT_CONFIG: ${{ inputs.protect_config }}
        run: |
          # 观测性(2026-10-15 排查教训)：本次提交的配置原文/解析参数/规则内容必须进
          # build.log——否则失败排查时(如规则误填 ** 触发全量转译)对"实际提交了什么"
          # 一无所知，只能去网页翻 step 日志。env 中转照旧，内容仅 tee 进日志文件。
          touch build.log
          echo "=== 本次提交的 protect_config 原文 ===" | tee -a build.log
          echo "$INPUT_PROTECT_CONFIG" | tee -a build.log
          python3 scripts/actions/resolve-config.py 2>&1 | tee -a build.log
          {
            echo "=== args.txt（一行一个参数）==="
            cat schema_rules/args.txt
            for f in schema_rules/*.txt; do
              [[ "$f" == schema_rules/args.txt ]] && continue
              echo "=== $f ==="; cat "$f"
            done
          } | tee -a build.log

      - name: 下载 APK
        timeout-minutes: 5
        env:
          # apk_url 同样经 env 中转：URL 直接插值进 bash 双引号可被 "$(...)" 逃逸
          # （安全审查 2026-09-18：protect_config 已中转，apk_url 补齐同一防线）
          APK_URL: ${{ inputs.apk_url }}
        run: |
          set -o pipefail
          # 报错四十四(2026-10-16): curl (3) URL rejected —— apk_url 含中文/空格
          # (文件名"简盒-正式版-...(1)_sign.apk")。curl 默认拒绝非 ASCII URL。
          # 修法: 下载前对 path/query 做百分号编码(scheme/host 保留,已编码的 %XX 不重复)。
          ENC_URL=$(APK_URL="$APK_URL" python3 -c 'import os, urllib.parse; u = os.environ["APK_URL"].strip(); p = urllib.parse.urlsplit(u); path = urllib.parse.quote(p.path, safe="/%:@"); query = urllib.parse.quote(p.query, safe="=&%:@") if p.query else ""; print(urllib.parse.urlunsplit((p.scheme, p.netloc, path, query, "")))')
          [ -n "$ENC_URL" ] || { echo "apk_url 为空" | tee -a build.log; exit 1; }
          echo "下载 URL(编码后): $ENC_URL" | tee -a build.log
          curl -fL --retry 3 -o app.apk "$ENC_URL" 2>&1 | tee -a build.log
          ls -la app.apk | tee -a build.log

      - name: 执行模块编排（固定顺序-签名校验-Dex2C-字符串加密-防对比混淆-环境检测-基础加壳）
        env:
          ANDROID_NDK_HOME: ${{ steps.toolchain.outputs.ndk-path }}
          # 通用 dpt 参数通道(报错四十三后方向调整):env 中转防注入,与 protect_config 同款
          INPUT_DPT_EXTRA_ARGS: ${{ inputs.dpt_extra_args }}
        run: |
          chmod +x scripts/pipelines/protect.sh
          # §10.2：读取时必须过滤空行（禁止直接 mapfile < args.txt）；
          # 一行一个参数 + "${ARGS[@]}" 引用展开，禁止空格分隔单行 + 无引号 $ARGS
          mapfile -t ARGS < <(grep -v '^$' schema_rules/args.txt)
          EXTRA_ARGS=()
          [[ -n "${INPUT_DPT_EXTRA_ARGS:-}" ]] && EXTRA_ARGS+=(--dpt-extra-args "$INPUT_DPT_EXTRA_ARGS")
          set -o pipefail
          ./scripts/pipelines/protect.sh app.apk protected_unsigned.apk "${ARGS[@]}" ${EXTRA_ARGS[@]+"${EXTRA_ARGS[@]}"} 2>&1 | tee -a build.log

      # ── 可选签名（默认关闭，保持"产物未签名"契约）───────────────────
      # 为什么做成可选而非默认：
      #   本仓库的既有契约是「产出未签名包，开发者自行重签」（见 AGENTS.md
      #   与流程文档 §2 步骤 11）。App 走默认路径时不应改变这个行为。
      #   但 CLI 调试时每次手工重签很烦（trigger_build.py 的诉求），
      #   所以给一个显式开关。
      #
      # ⚠️ 只接受 workflow input sign=true 触发，不接受 protect_config 里的
      #    字段：resolve-config.py 有白名单保险丝（未知顶层 key 直接 die），
      #    往 protect_config 加 sign 会让整个流程 fail-fast。
      #
      # ⚠️ 必须用【上传 APK 时那把 keystore】：加 --sigcheck 后 libnc.so 里
      #    写的是原证书的指纹，换证书重签 → 运行期证书派生失败 → 包起不来。
      #    （所以 secrets 里的 keystore 必须与用户上传的 APK 同源。）
      #
      # secrets 缺失时 fail-fast，不静默跳过 —— 否则用户以为签了，装上去
      # 还是"未签名，无法安装"。
      # apksigner / zipalign 在 Android SDK build-tools 里，ubuntu runner 默认
      # 不装。用 setup-android 装一份并写进 PATH。
      # ⚠️ 只在 sign=true 时跑，不给默认路径增加下载开销。
      - name: 安装 Android build-tools（签名工具）
        if: inputs.sign
        uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;34.0.0'

      - name: 签名产物（可选）
        if: inputs.sign
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          missing=()
          [[ -n "$KEYSTORE_B64" ]] || missing+=("KEYSTORE_BASE64")
          [[ -n "$KS_PASS"      ]] || missing+=("KEYSTORE_PASSWORD")
          [[ -n "$KEY_ALIAS"    ]] || missing+=("KEY_ALIAS")
          [[ -n "$KEY_PASS"     ]] || missing+=("KEY_PASSWORD")
          if (( ${#missing[@]} > 0 )); then
            echo "❌ 请求了 sign=true 但缺少 Secrets: ${missing[*]}" | tee -a build.log
            echo "   存法见 docs/AI接手文档.md" | tee -a build.log
            exit 1
          fi

          # ── 定位 apksigner / zipalign ────────────────────────────────
          # setup-android 把它们装在 $ANDROID_HOME/build-tools/<ver>/ 下，
          # 但默认不在 PATH 里。显式找出目录加进 PATH，找不到就 fail-fast
          # （否则报 "apksigner: command not found" 而看不出是没装好）。
          BT=""
          for cand in "$ANDROID_HOME"/build-tools/*/; do
            if [[ -x "${cand}apksigner" ]]; then BT="$cand"; break; fi
          done
          if [[ -z "$BT" ]]; then
            echo "❌ 找不到 apksigner（build-tools 未安装？）" | tee -a build.log
            ls "$ANDROID_HOME"/build-tools/ 2>/dev/null | tee -a build.log || true
            exit 1
          fi
          export PATH="$BT:$PATH"
          echo "build-tools: $BT" | tee -a build.log

          # keystore 只落临时目录，跑完随 runner 销毁（不写 workspace，避免
          # 被 upload-artifact / 缓存意外带走）
          KS="$RUNNER_TEMP/release.keystore"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$KS"
          # 校验解出来是真 keystore（防 base64 截断/换行问题）
          keytool -list -keystore "$KS" -storepass "$KS_PASS" >/dev/null 2>&1 \
            || { echo "❌ keystore 解密失败：base64 或密码不对" | tee -a build.log; exit 1; }
          echo "✅ keystore 载入成功" | tee -a build.log

          # zipalign 必须在 apksigner 之前（apksigner 之后再对齐会破坏签名）
          aligned="$RUNNER_TEMP/aligned.apk"
          if command -v zipalign >/dev/null 2>&1; then
            zipalign -f -p 4 protected_unsigned.apk "$aligned" 2>&1 | tee -a build.log
          else
            echo "⚠ 无 zipalign，跳过对齐" | tee -a build.log
            cp protected_unsigned.apk "$aligned"
          fi

          apksigner sign \
            --ks "$KS" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KS_PASS" --key-pass "pass:$KEY_PASS" \
            --out protected_signed.apk "$aligned" 2>&1 | tee -a build.log

          apksigner verify --print-certs protected_signed.apk 2>&1 | tee -a build.log
          # 原产物改名，让下游"上传哪个文件"无歧义
          mv protected_unsigned.apk protected_unsigned_unsigned.apk
          mv protected_signed.apk protected_unsigned.apk
          echo "✅ 已签名（cert: $(apksigner verify --print-certs protected_unsigned.apk 2>/dev/null | grep 'SHA-256 digest' | head -1 | awk '{print $NF}')）" | tee -a build.log
          rm -f "$KS"

      - name: 上传加固包到 R2
        id: upload-r2
        run: |
          set -o pipefail
          if [[ -z "$R2_ENDPOINT" || -z "$R2_BUCKET" ]]; then
            echo "❌ R2_ENDPOINT/R2_BUCKET 为空，检查仓库 Secrets" | tee -a build.log
            exit 1
          fi
          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY"
          export AWS_SECRET_ACCESS_KEY="$R2_SECRET_KEY"
          export AWS_DEFAULT_REGION="auto"
          SAFE_NAME="${GITHUB_RUN_ID}_模块勾选包.apk"
          aws s3 cp protected_unsigned.apk "s3://$R2_BUCKET/apks/$SAFE_NAME" \
            --endpoint-url "$R2_ENDPOINT" --no-progress 2>&1 | tee -a build.log
          DL="$R2_PUBLIC_DOMAIN/apks/$SAFE_NAME"
          echo "download_url=$DL" >> "$GITHUB_OUTPUT"
          echo "🔗 下载地址: $DL" | tee -a build.log

      - name: 显示下载链接
        run: |
          echo "::notice title=📥 模块勾选加固包(未签名,请自行重签)::${{ steps.upload-r2.outputs.download_url }}"

      - name: 上传构建日志（无论成败都可下载）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 构建日志-build.log
          path: build.log
          if-no-files-found: warn
          retention-days: 1

      - name: Artifact 备用
        uses: actions/upload-artifact@v4
        with:
          name: 模块勾选加固包-未签名
          path: protected_unsigned.apk
          if-no-files-found: error
          retention-days: 1
