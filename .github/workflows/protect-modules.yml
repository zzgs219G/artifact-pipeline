name: APK加固-模块勾选

# 勾选式统一入口（schema 驱动动态配置版）：
#   App 拉取 configs/v1/config-schema.json 生成父子级勾选 UI → 生成 protect_config
#   JSON → dispatch 传入 → scripts/actions/resolve-config.py 按 schema 解释成
#   protect.sh 参数（schema_rules/args.txt，一行一个）→ 执行。
#   加新模块/子选项只改 configs/v1/config-schema.json 一份文件（App 与本 yml 零改动）。
# 执行顺序由 protect.sh 固定为
#   签名校验 → Dex2C(唯一转译引擎) → 字符串加密 → 防对比混淆(anti-diff) → 环境检测(envcheck) → 基础加壳(packer)
#   （anti-diff 是 dex 层结构噪声,放 stringenc 后;加壳必须最后，加了壳其它模块改不动）
# GitHub 网页兜底：不勾任何模块时可直接在 protect_config 手填 JSON（见 configs/v1/config-schema.json）。

on:
  # push 触发：只跑 test job（回归检查）。protect job 会被 job 级 if 挡住——
  # 它是 workflow_dispatch 专用（需要 apk_url / protect_config 必填输入）。
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'configs/**'
      - 'docs/**'
      - '.github/**'
      - '*.md'
  # PR 也跑一遍：避免直接推 main 前的改动没被检查过
  pull_request:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'configs/**'
      - 'docs/**'
      - '.github/**'
      - '*.md'
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'APK下载链接(需已用开发者keystore签名)'
        required: true
      protect_config:
        description: '加固配置JSON(schema驱动;结构见 configs/v1/config-schema.json)'
        required: true
      dpt_extra_args:
        description: '附加 dpt.jar 参数,空格分隔,如 --smaller(自由文本只构成打包参数注入面,最坏打包失败;secrets 不经此路径)'
        required: false
        default: 
      sign:
        description: '是否签名产物（true=用 KEYSTORE_BASE64 对应的 keystore 重签，产出可直接安装；默认 false=保持"未签名"契约）'
        required: false
        type: boolean
        default: false
      amice_probe:
        description: '仅跑 Amice 混淆插件探路（不下载 APK、不出包）。用于验证 848MB bundle 在本环境能否加载插件'
        required: false
        type: boolean
        default: false

jobs:
  # ── 秒级回归（2026-11-01 新增）────────────────────────────────────
  # 为什么需要：CI 此前【一个测试都不跑】，只做构建。代价已经付过——
  #   test-workflow-yml.sh（10-31 加 sign input 未同步断言）与
  #   check-schema.py（10 月删 dcc 模块未同步断言）两个测试红了几个月，
  #   没有任何人知道，因为没有任何机器在跑它们。
  # AGENTS.md 写着"文字警告防不住文本级重写，只有回归测试能"——但前提是
  # 测试真的在跑。本 job 补上这一环。
  #
  # 本 job 只放【秒级、零外部依赖】的检查，成本几乎为零：
  #   不装 NDK / 不装 java / 不 clone nox，跑完 <10s。
  # 重型套件（so-lock/stringenc/javacheck 等 11 分钟）见 AGENTS.md 的待办，
  # 需要 clone nox 仓库才能跑，另行安排。
  #
  # 与 protect 并行，不拖慢出包。
  test:
    runs-on: ubuntu-24.04
    # 第一批（秒级检查）+ 第二批（stringenc/anti-diff/packer，本地实测约 4 分钟）
    # 留 2 倍余量：CI runner 比本地 Termux 慢，首次还要下载依赖。
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 改个文档也跑全套检查没意义，但【文档检查本身必须跑】——
      # 它校验的就是文档里的路径是否还存在，正是文档改动的把关点。
      - name: 检测改动范围
        id: scope
        uses: dorny/paths-filter@v3
        with:
          filters: |
            docs:
              - 'docs/**'
              - '*.md'
            code:
              - 'scripts/**'
              - 'configs/**'
              - 'tools/**'
              - '.github/**'

      # ── 环境准备：与 protect job 共用同一个 composite action ────────
      # 用户口径："检查的环境和构建脚本环境一样不就好了" —— 对，而且不该靠
      # 手工抄。最初这个 job 是照 protect job 抄的，结果连续 5 次 CI 红，
      # 全是抄漏/抄错（漏 pip 依赖、漏解压 dex2c、抄了个不存在的 nox tag）。
      # 现在两边都 uses ./.github/actions/setup-toolchain，只有一份真相。
      #
      # nox-ref 用 main 而不是某个 tag：nox 最新 tag 是 v0.4.0，它【早于】
      # 修复 nc_guard_jni 缺失的那个提交（1f1a732），锁 v0.4.0 等于测旧代码。
      # 之前我凭 tools/nox/VERSION 里的 "v0.4.2" 想当然写了 ref: v0.4.2，
      # 而 nox 仓库根本没有这个 tag —— checkout 直接失败。
      # 教训：写 ref 前必须 `git tag -l` 核实，不能凭版本文件猜。
      - name: 准备工具链（与出包 job 同一套）
        if: steps.scope.outputs.code == 'true'
        uses: ./.github/actions/setup-toolchain
        with:
          ndk-version: r27d
          nox-source: 'true'   # so 层测试要 nox 源码形态
          nox-ref: main

      - name: 文档路径有效性（改文档必跑）
        if: steps.scope.outputs.docs == 'true'
        run: python3 scripts/actions/tests/test-docs-paths.py

      - name: schema 结构自检
        if: steps.scope.outputs.code == 'true'
        run: python3 scripts/actions/check-schema.py configs/v1/config-schema.json

      - name: schema 解释器回归（40 用例）
        if: steps.scope.outputs.code == 'true'
        run: python3 scripts/actions/tests/test-resolve-config.py

      - name: workflow yml 结构自检
        if: steps.scope.outputs.code == 'true'
        run: bash scripts/actions/tests/test-workflow-yml.sh

      - name: smali 参数槽计数
        if: steps.scope.outputs.code == 'true'
        run: bash scripts/lib/tests/test-smali-params.sh

      - name: dex 版本头 save/restore
        if: steps.scope.outputs.code == 'true'
        run: bash scripts/repack/tests/test-patch-dex-version.sh

      # inject-loadlib 是冻结模块，历史上出过 14 次事故（53 条报错里最多），
      # 却一直没有独立测试。纯 stdlib，秒级，无外部依赖。
      - name: inject-loadlib 插桩（73 断言，纯 stdlib）
        if: steps.scope.outputs.code == 'true'
        run: python3 scripts/inject/tests/test_inject_loadlib.py

      # mark-native 同为冻结模块，历史 11 次事故（报错十/十三/三十九），
      # 此前只有 test-javacheck 的 [5b/9] 间接覆盖"native 壳跳过注入"一个点。
      - name: mark-native 壳替换（42 断言，纯 stdlib）
        if: steps.scope.outputs.code == 'true'
        run: python3 scripts/repack/tests/test_mark_native.py

      # ── 第二批（2026-11-01）：中等耗时，仍【不需要 nox / NDK】──────
      # 这些套件只依赖 JDK + 仓库内已入库的工具（apktool.jar / d8.jar），
      # 本地实测合计约 4 分钟。放进来能覆盖 dex 层与加壳层的回归，
      # 而 Bug 1/Bug 2 那类"构建绿装机崩"的事故面主要在 stringenc/packer。
      - name: anti-diff 冒烟（含报错三十一~四十一回归）
        if: steps.scope.outputs.code == 'true'
        run: bash scripts/anti-diff/tests/test-smoke.sh

      - name: dex 容量检测（33 断言，含报错五十九回归）
        if: steps.scope.outputs.code == 'true'
        run: python3 scripts/repack/tests/test_dex_capacity.py

      - name: NcLink 动态注册（23 断言，含 XOR 表与 Java 一致性）
        if: steps.scope.outputs.code == 'true'
        run: python3 scripts/guard/javalink/tests/test_nclink_dynreg.py

      - name: protect.sh 变量定义/使用顺序（set -u 防崩，bash -n 查不出）
        if: steps.scope.outputs.code == 'true'
        run: python3 scripts/actions/tests/test_protect_sh_vars.py

      - name: obfuscate 参数契约（schema→resolver→protect.sh 三处同步）
        if: steps.scope.outputs.code == 'true'
        run: python3 scripts/actions/tests/test_obfuscate_args.py

      # VMP 前置条件（2026-11-10）：VMP 的失败模式是【静默跳过】——
      # Amice 遇到不满足条件的函数直接跳过，构建全绿但没虚拟化。
      # 21 项断言钉住 attribute 形态（不得含 used/retain）、IR 三条件、
      # 两条反向验证、以及 --vmp 自动联动静态注册。
      - name: VMP 前置条件（21 断言，含两条反向验证）
        if: steps.scope.outputs.code == 'true'
        run: bash scripts/pipelines/tests/test-vmp-preconditions.sh

      - name: nox 源码拷贝清单完整性（拆 .c 后必查）
        if: steps.scope.outputs.code == 'true'
        run: python3 scripts/actions/tests/test_nox_copy_list.py

      - name: packer 冒烟（26 项，含 schema→arg 契约）
        if: steps.scope.outputs.code == 'true'
        run: bash scripts/packer/tests/test-packer.sh

      - name: stringenc 冒烟（27 断言 + apktool 真汇编）
        if: steps.scope.outputs.code == 'true'
        run: bash scripts/string-enc/tests/test-encrypt-smoke.sh

      - name: stringenc 续跑 + 桩结构不变量
        if: steps.scope.outputs.code == 'true'
        run: bash scripts/string-enc/tests/test-structure-resume.sh

      - name: stringenc 桩随机化（6 断言组）
        if: steps.scope.outputs.code == 'true'
        run: bash scripts/string-enc/tests/test-stub-randomize.sh

      - name: stringenc 密钥流双端对拍（468 例）
        if: steps.scope.outputs.code == 'true'
        run: bash scripts/string-enc/tests/test-keystream-crosscheck.sh

      - name: stringenc↔dex2c 联动端到端（7 断言）
        if: steps.scope.outputs.code == 'true'
        run: bash scripts/string-enc/tests/test-link-dex2c.sh

      # ── 纯 C 解密桩（2026-11-09）──────────────────────────────────
      # 两套：① 三方对拍（C↔Python，287 断言，需 clang+python3）
      #       ② C↔真实 Java 桩逐字节对拍（152 条，需 JDK；无 JDK 则 skip）
      # 分两套的原因：②对拍的是"线上正在用的实现"，是 C 能否替换它的
      # 唯一凭证；①只证明 C 与参考实现一致，替代不了②。
      - name: 纯 C 解密桩三方对拍（287 断言）
        if: steps.scope.outputs.code == 'true'
        run: bash scripts/string-enc/tests/test-cstrdec.sh

      - name: 纯 C 解密桩 vs 真实 Java 桩（184 项）
        if: steps.scope.outputs.code == 'true'
        run: bash scripts/string-enc/tests/test-cstrdec-vs-java.sh

      - name: 纯 C 解密桩端到端闭环（加密→产物→C 解出原文）
        if: steps.scope.outputs.code == 'true'
        run: bash scripts/string-enc/tests/test-cstrdec-e2e.sh

      # ── 第三批（2026-11-01）：so 层与签名校验，需要 nox 源码 / clang ──
      # 这批覆盖 Bug 1 那类"so 侧缺实现导致装机闪退"的事故面，
      # 也是历史上唯一靠真机才能发现的地方 —— 现在至少有宿主端断言兜底。
      - name: so 段加密设施（52 项，读 ../nox 源码）
        if: steps.scope.outputs.code == 'true'
        run: bash scripts/lib/tests/test-so-lock.sh

      - name: sig_guard2 派生对拍
        if: steps.scope.outputs.code == 'true'
        run: bash scripts/guard/tests/test-sig-guard2.sh

      - name: env_mem_readable 跨映射判定
        if: steps.scope.outputs.code == 'true'
        run: bash scripts/guard/tests/test-mem-readable.sh

      - name: LSGS 特征串密文化（12 断言）
        if: steps.scope.outputs.code == 'true'
        run: bash scripts/guard/tests/test-lsgs-strings.sh

      # ⚠️ test-sig-verify.sh 未接入：它需要一份【已签名的真实 APK】作为夹具，
      # 而 CI 干净树里没有。该脚本在没有 APK 时是 `skip + exit 0`——
      # 接进来等于"0 通过 0 失败"，是假绿，比不接更糟。
      # 待办：把一份小体积已签名 APK 作为夹具入库（<200KB），再接入。
      # 见 AGENTS.md「冻结资产的能力边界」。

  # ── Amice 混淆插件探路（2026-11-05）────────────────────────────────
  # 目的：回答一个二元问题 —— Amice 能不能在我们这套 NDK 环境里用。
  # 不碰主流程：独立 job，失败不影响 protect/test。
  #
  # 为什么需要它：当前防护三层里「读」这一层几乎裸奔（明文 .text 里
  # 200 行解密逻辑，符号被 strip 但 bti c 标出函数边界）。Amice 是
  # LLVM Pass 插件，能用 __attribute__((annotate(...))) 只混淆指定函数，
  # 不需要自建 LLVM 工具链（stock NDK clang 不认识 -fla 那套）。
  #
  # 为什么要在 CI 里跑：848MB bundle 本地下载不动（实测 130KB/s + TLS 断连），
  # 而 runner 到 GitHub 是内网，约 10-30 秒。
  #
  # 只验三件事（不做任何构建接入）：
  #   ① 插件能加载（无 "unable to load plugin" —— 缺 libLLVM.so 时就是这个错）
  #   ② 命令级混淆生效（MBA/平坦化不报错且产物能编译出来）
  #   ③ 能编出 arm64 Android 目标（说明 bundle 的 NDK 可用）
  amice-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # 只在手动触发时跑：848MB 下载不该占用每次 push 的时间。
    if: github.event_name == 'workflow_dispatch' && inputs.amice_probe
    steps:
      - name: 下载 Amice bundle（带缓存）
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/amice-bundle
          key: amice-r29-v0.1.6-nox1

      - name: 解压 Amice bundle
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/amice-bundle && cd ~/amice-bundle
          URL=https://github.com/zzgs219G/amice/releases/download/v0.1.6-nox1/amice-android-ndk-r29-linux-x86_64.tar.gz
          echo "下载 $URL"
          curl -fL --retry 3 --retry-delay 5 -o amice.tar.gz "$URL"
          echo "=== 校验 sha256（官方值见 release 资产 .sha256）==="
          curl -fsSL -o amice.tar.gz.sha256 "$URL.sha256" || true
          if [[ -s amice.tar.gz.sha256 ]]; then
            WANT=$(awk '{print $1}' amice.tar.gz.sha256)
            GOT=$(sha256sum amice.tar.gz | awk '{print $1}')
            [[ "$WANT" == "$GOT" ]] \
              || { echo "❌ sha256 不符: want=$WANT got=$GOT"; exit 1; }
            echo "✅ sha256 一致: $GOT"
          else
            echo "⚠️ 无 .sha256 资产，跳过校验"
          fi
          tar xzf amice.tar.gz
          rm -f amice.tar.gz
          # 展平成固定路径，便于后续 step 引用
          SRC=$(find . -maxdepth 1 -type d -name 'amice-android-ndk-*' | head -1)
          [[ -n "$SRC" ]] || { echo "❌ 解压后找不到 bundle 目录"; exit 1; }
          mv "$SRC"/* . 2>/dev/null || true
          echo "=== bundle 顶层 ==="
          ls -la

      - name: 断言 bundle 含插件与 llvm-lib（缺一即不可用）
        run: |
          set -euo pipefail
          cd ~/amice-bundle
          fail=0
          [[ -f amice/lib/libamice.so ]] || { echo "❌ 缺 amice/lib/libamice.so"; fail=1; }
          [[ -d amice/llvm-lib ]]       || { echo "❌ 缺 amice/llvm-lib（这是 848MB 的主要构成）"; fail=1; }
          [[ -f amice/env.sh ]]         || { echo "❌ 缺 amice/env.sh"; fail=1; }
          [[ -x amice/bin/aarch64-linux-android-clang ]] \
            || { echo "❌ 缺 aarch64 wrapper"; fail=1; }
          if [[ $fail -ne 0 ]]; then
            echo "=== 实际内容 ==="
            find . -maxdepth 2 -type d | head -20
            exit 1
          fi
          echo "✅ bundle 结构完整"
          ls -la amice/lib/ | head -5
          du -sh amice/llvm-lib

      - name: 编译探针（断言插件加载 + 混淆生效 + arm64 目标）
        run: |
          set -euo pipefail
          cd ~/amice-bundle
          source ./amice/env.sh

          cat > /tmp/probe.c <<'SRC'
          /* 探针目标：一个函数带标记字符串，开了字符串加密后
           * `strings` 应搜不到标记；再开 MBA/平坦化验证 pass 不崩。 */
          #include <stdio.h>
          __attribute__((annotate("amice_mba"), annotate("amice_flatten")))
          int calc(int a, int b) {
              int x = a * 2 + b;
              int y = (x ^ 0x5A5A) - (b << 1);
              return x + y;
          }
          int main(void) {
              const char *marker = "AMICE_PROBE_MARKER_20261105";
              printf("%s %d\n", marker, calc(3, 4));
              return 0;
          }
          SRC

          echo "=== 1) 不带插件先编一遍（基线，确认工具链本身可用）==="
          ./amice/bin/aarch64-linux-android-clang /tmp/probe.c -o /tmp/probe_plain 2>&1 | tee /tmp/plain.log
          file /tmp/probe_plain
          if strings -a /tmp/probe_plain | grep -q AMICE_PROBE_MARKER_20261105; then
            echo "✅ 基线：标记串明文存在（预期）"
          else
            echo "❌ 基线异常：明文编译也没有标记串"
            exit 1
          fi

          echo "=== 2) 带插件 + 开关编第二遍 ==="
          export AMICE_STRING_ENCRYPTION=true
          export AMICE_MBA=true
          export AMICE_INDIRECT_CALL=true
          export AMICE_INDIRECT_BRANCH=true
          ./amice/bin/aarch64-linux-android-clang /tmp/probe.c -o /tmp/probe_amice 2>&1 | tee /tmp/amice.log
          file /tmp/probe_amice

          echo "=== 3) 断言：插件真的加载了（没有 load 失败）==="
          if grep -qiE "unable to load plugin|libLLVM\.so: cannot open" /tmp/amice.log; then
            echo "❌ 插件加载失败（通常是 libLLVM.so 不匹配）"
            exit 1
          fi
          echo "✅ 插件加载无错"

          echo "=== 4) 断言：混淆生效（标记串消失）==="
          if strings -a /tmp/probe_amice | grep -q AMICE_PROBE_MARKER_20261105; then
            echo "❌ 标记串仍为明文 —— 字符串加密没生效"
            exit 1
          fi
          echo "✅ 标记串已加密（strings 零命中）"

          echo "=== 5) 断言：产物是 arm64 ==="
          file /tmp/probe_amice | grep -q "ARM aarch64" \
            || { echo "❌ 产物不是 aarch64"; file /tmp/probe_amice; exit 1; }
          echo "✅ 目标是 arm64"

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ Amice 在本环境可用"
          echo "   bundle: r29 / v0.1.6-beta.1"
          echo "   插件加载、字符串加密、arm64 目标 三项全过"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: 上传日志（无论成败）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amice-probe-log
          path: |
            /tmp/plain.log
            /tmp/amice.log
          if-no-files-found: warn
          retention-days: 3

  # ── Amice 真实接入验证（2026-11-05）────────────────────────────────
  # 第一步 probe 已证明"插件能加载"（run 42042744635 五项全过）。
  # 本 job 回答第二个问题：**用 Amice 编译我们真实的 so，壳还能不能解锁。**
  #
  # 为什么这一步是必须的（不能跳过直接接主流程）：
  #   nox 的锁箱链有 CRC 自绑定 —— k_stub 混入了 crc32(.text)，
  #   代码改一位 → CRC 变 → k_stub 变 → .ncxh 解出乱码 → SIGILL。
  #   而混淆恰恰会大幅改变 .text 内容。所以必须先验证：
  #     · .ncx / .ncxh / .nck / .ncks 四段还在（__attribute__((section)) 未被破坏）
  #     · 混淆后 selftest 仍返回 59（解锁→解密→执行密文段全链路）
  #
  # 本 job 不开任何混淆 pass（AMICE_* 全关），只验证"换编译器不破坏结构"。
  # 混淆开关留到结构验证通过后再单独测 —— 否则崩了分不清是哪个原因。
  amice-integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    if: github.event_name == 'workflow_dispatch' && inputs.amice_probe
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 取 Amice bundle（复用 probe 的 cache）
        uses: actions/cache@v4
        with:
          path: ~/amice-bundle
          key: amice-r29-v0.1.6-nox1

      - name: 若 cache 未命中则下载
        run: |
          set -euo pipefail
          if [[ -f ~/amice-bundle/amice/env.sh ]]; then
            echo "✅ cache 命中"; exit 0
          fi
          mkdir -p ~/amice-bundle && cd ~/amice-bundle
          URL=https://github.com/zzgs219G/amice/releases/download/v0.1.6-nox1/amice-android-ndk-r29-linux-x86_64.tar.gz
          curl -fL --retry 3 -o a.tar.gz "$URL"
          curl -fsSL -o a.sha256 "$URL.sha256"
          WANT=$(awk '{print $1}' a.sha256); GOT=$(sha256sum a.tar.gz | awk '{print $1}')
          [[ "$WANT" == "$GOT" ]] || { echo "❌ sha256 不符"; exit 1; }
          tar xzf a.tar.gz && rm -f a.tar.gz
          SRC=$(find . -maxdepth 1 -type d -name 'amice-android-ndk-*' | head -1)
          mv "$SRC"/* . && rmdir "$SRC"
          echo "✅ 解压完成"

      - name: 取 nox 源码（锁箱必需）
        run: |
          set -euo pipefail
          # nox 是独立上游仓库，与本仓库同级（见 docs/上游仓库-nox.md）
          git clone --depth 1 https://github.com/zzgs219G/nox.git "$GITHUB_WORKSPACE/../nox"
          ls ../nox/scripts/so-guard/nc_guard_boot.c

      - name: 用 Amice clang 编译真实 so（四段 + 锁箱）
        run: |
          set -euo pipefail
          cd ~/amice-bundle
          source ./amice/env.sh
          echo "=== Amice clang 版本 ==="
          ./amice/bin/aarch64-linux-android-clang --version | head -2

          R="$GITHUB_WORKSPACE"
          G="$GITHUB_WORKSPACE/../nox/scripts/so-guard"
          W=/tmp/ncbuild
          rm -rf "$W" && mkdir -p "$W/jni"

          # 只取锁箱四件套 + 契约头（不取 sig_check/nc_link，那个组合要 JNI 表，
          # 本步骤只验"结构 + 解锁"，与 sigcheck 无关）
          cp "$G/nc_guard_boot.c" "$G/nc_guard_probe.c" "$G/nc_guard_key.c" \
             "$G/nc_guard_paths.c" "$G/nc_guard_jni.c" "$W/jni/"
          cp "$G/nc_guard_layout.h" "$G/nc_guard_key.h" "$G/nc_guard_paths.h" "$W/jni/"

          cd "$W/jni"
          # 与 lib-ndk.sh 的 CFLAGS 逐字对齐（除编译器换成 Amice 的）
          FLAGS="-fPIC -fvisibility=hidden -fno-ident -Oz -ffunction-sections \
                 -fdata-sections -fstack-protector-strong -DNC_GUARD_SECTIONED \
                 -DNCG_PATH_STRICT -Wall"
          CC="$HOME/amice-bundle/amice/bin/aarch64-linux-android-clang"

          echo "=== 变体 A：基线（不开混淆，对照组）==="
          "$CC" -shared $FLAGS *.c -o libnc_base.so -Wl,--gc-sections \
            2>&1 | tee /tmp/compile_base.log

          echo "=== 变体 B：开 MBA 混淆 ==="
          # NC_AMICE_ANNOTATE 让 nc_guard_boot.c 的 NC_OBF 展开成
          # __attribute__((noinline, annotate("+mba")))，标注 ncg_xor_key
          # 与 ncg_boot_key（读懂它们就能复现整条解密链）。
          # 只开 MBA 不开 flatten：flatten 重排控制流，constructor(50)
          # 关键路径上风险高；MBA 是算术等价替换，风险低一个量级。
          "$CC" -shared $FLAGS -DNC_AMICE_ANNOTATE *.c -o libnc_obf.so \
            -Wl,--gc-sections 2>&1 | tee /tmp/compile_obf.log

          echo "=== 混淆是否真的生效 ==="
          if cmp -s libnc_base.so libnc_obf.so; then
            echo "FAIL: 两个变体逐字节相同，混淆没生效"
            exit 1
          fi
          b=$(stat -c%s libnc_base.so); o=$(stat -c%s libnc_obf.so)
          echo "OK: 产物不同。基线 ${b} 字节 -> 混淆 ${o} 字节"
          cp libnc_obf.so libnc.so

      - name: 断言 .ncx/.ncxh/.nck/.ncks 四段仍在
        run: |
          set -euo pipefail
          SO=/tmp/ncbuild/jni/libnc.so
          list=$(readelf -S "$SO")
          fail=0
          # 只断言【本 job 编译的 5 个文件能产生的段】。
          # .ncxr 不在此列 —— 它只由 nc_link.c 的 NC_VERIFY_TABLE_SECTION
          # 标记（sigcheck 模块），本 job 不编 nc_link.c（要 JNI 表，与本步无关）。
          for seg in .ncx .ncxh .nck .ncks .ncxhr; do
            if echo "$list" | grep -q " $seg "; then
              echo "  ✅ $seg"
            else
              echo "  ❌ $seg 缺失（__attribute__((section)) 被破坏？）"; fail=1
            fi
          done
          if echo "$list" | grep -q " .ncxr "; then
            echo "  ℹ️ .ncxr 存在（本 job 不该有，说明拷多了文件）"
          else
            echo "  ✅ .ncxr 不存在（预期：本 job 不编 nc_link.c）"
          fi
          [[ $fail -eq 0 ]] || { echo "=== 实际段表 ==="; echo "$list" | head -40; exit 1; }
          echo "✅ 五个加密段全部保留"

      - name: 锁箱（三步，顺序与 protect.sh:849-866 一致）
        run: |
          set -euo pipefail
          G="$GITHUB_WORKSPACE/../nox/scripts/so-guard"
          SO=/tmp/ncbuild/jni/libnc.so
          cd "$G"

          # ⚠️⚠️ 这三步是互斥分支，不能合并传参 ——
          #   so-section-lock.py:1453 是 `if args.strip_meta: ... if args.lock_head:
          #   ... return lock(...)`，传了 --lock-head 就【只】做二级锁箱，
          #   一级 .ncx 加密会被跳过。实测踩过：同时传 --lock-head --strip-meta
          #   导致 .ncx 保持明文 ARM64 指令（熵 5.5），看起来"锁了"实际没锁。
          #
          # 需要一份真实 APK 提供证书与包名。nox 自带的 fixtures/sample.apk
          # 只有 1.5KB，AXML 无 string pool → manifest_package 抛
          # 'AXML 无 string pool'（实测）。改用本仓库入库的 scripts/样本.apk。
          APK="$GITHUB_WORKSPACE/scripts/样本.apk"
          [[ -f "$APK" ]] || { echo "❌ 缺 $APK"; ls "$GITHUB_WORKSPACE/scripts/"*.apk; exit 1; }

          echo "=== 步骤 1/3：一级锁箱 .ncx ==="
          python3 so-section-lock.py "$SO" "$SO" --section .ncx --from-apk "$APK" \
            2>&1 | tee /tmp/lock1.log | tail -8

          echo "=== 步骤 2/3：二级锁箱 --lock-head（.ncxh）==="
          python3 so-section-lock.py "$SO" "$SO" --lock-head \
            2>&1 | tee /tmp/lock2.log | tail -8

          echo "=== 步骤 3/3：元数据清理 --strip-meta ==="
          python3 so-section-lock.py "$SO" "$SO" --strip-meta \
            2>&1 | tee /tmp/lock3.log | tail -5

          echo "=== 锁箱后段表 ==="
          readelf -S "$SO" | grep -E "\.nc"

      - name: 断言 CRC 自绑定在混淆后仍自洽（关键项）
        run: |
          set -euo pipefail
          # 这是 Amice 接入里最容易翻车的一条，单独断言。
          #
          # 机制：lock_head() 把 .text 的 sh_addr/sh_size 写进 .ncks 的
          #   code_addr/code_len（so-section-lock.py:1195）；运行期
          #   ncg_stub_recover 对这段算 CRC32 并异或进 k_stub。
          #   代码改一位 → CRC 变 → k_stub 变 → .ncxh 解出乱码 → SIGILL。
          #
          # 混淆会大幅改变 .text 内容与尺寸，所以必须确认：
          #   ① .text 内无重定位 —— 否则锁箱期按文件算的 CRC 与运行期
          #      按内存算的不同，正常包也解不开（test-so-lock.sh T31 同一前提）
          #   ② .text 非空且 addr==off（自绑定按文件偏移算）
          python3 scripts/repack/verify_text_crc_ready.py /tmp/ncbuild/jni/libnc.so

      - name: 断言锁箱后结构正确（静态；执行类须真机，见步骤内说明）
        run: |
          set -euo pipefail
          # ⚠️ 本 job **不能**验证 selftest==59：CI 是 x86_64，产物是 ARM64，
          #    dlopen 不了。nox 自己的 test.sh 在这里也是同一个取舍
          #    （test.sh:105 "产出的 so 是 ARM，宿主跑不起来 → V5/V6/V7 必须跳过"）。
          #    执行类验证（真解锁 → 解 .ncx → 执行密文段）只能在真机做。
          #    本步只验"混淆/换编译器后，静态结构没被破坏"——那是本 job 的目的。
          SO=/tmp/ncbuild/jni/libnc.so
          echo "=== 1) 段仍存在 ==="
          readelf -S "$SO" | grep -cE "\.ncks|\.nck|\.ncxh"
          echo "=== 2) .ncx 熵 > 7.0（确认是密文）==="
          python3 - "$SO" <<'PY'
          import sys, math, struct
          from collections import Counter
          d = open(sys.argv[1], 'rb').read()
          e_shoff = struct.unpack_from('<Q', d, 0x28)[0]
          e_shentsize = struct.unpack_from('<H', d, 0x3a)[0]
          e_shnum = struct.unpack_from('<H', d, 0x3c)[0]
          e_shstrndx = struct.unpack_from('<H', d, 0x3e)[0]
          def sh(i): return struct.unpack_from('<IIQQQQIIQQ', d, e_shoff + i*e_shentsize)
          stroff = sh(e_shstrndx)[4]
          segs = {}
          for i in range(e_shnum):
              s = sh(i)
              name = d[stroff+s[0]:d.index(b'\0', stroff+s[0])].decode('latin1')
              if s[1] != 8: segs[name] = (s[4], s[5])
          # 判据：用"距离理论上限有多近"，不能用固定的 7.0。
          # 均匀分布下 n 个样本能观测到的最大熵 ≈ log2(min(n,256))，
          # 所以小段（本 job 的 .ncx 只有 176 字节 → 上限 7.459）永远到不了 8.0。
          # 实测：正确锁箱后 .ncx 熵 6.983（上限 7.459，差 0.48）；
          #       未锁箱时是同长度明文 ARM64 指令，熵约 5.5。
          # 故判据取 "上限 - 0.8"，既能过正确锁箱，又能抓住"根本没加密"。
          bad = 0
          for k in ('.ncx', '.ncxh'):
              if k not in segs:
                  print(f"  ❌ {k} 缺失"); bad = 1; continue
              o, sz = segs[k]
              b = d[o:o+sz]
              c = Counter(b); n = len(b)
              e = -sum((v/n)*math.log2(v/n) for v in c.values()) if n else 0
              lim = math.log2(min(n, 256)) if n else 0
              ok = e > lim - 0.8
              print(f"  {'✅' if ok else '❌'} {k}: {sz}B 熵={e:.3f} (上限 {lim:.3f})")
              if not ok: bad = 1
          sys.exit(bad)
          PY
          echo "✅ 加密段为真实密文"

      - name: 上传产物与日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amice-integrate-artifact
          path: |
            /tmp/ncbuild/jni/libnc.so
            /tmp/compile.log
            /tmp/lock.log
          if-no-files-found: warn
          retention-days: 3

  protect:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    # 只在手动触发（workflow_dispatch）时出包。
    # push / pull_request 只跑上面的 test job —— 它们没有 apk_url 与 protect_config，
    # 跑 protect 会因必填输入为空直接失败，变成无意义的红叉。
    # 同时排除 amice_probe 模式：那个模式只做插件探路，不下 APK、不出包。
    if: github.event_name == 'workflow_dispatch' && !inputs.amice_probe
    env:
      R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
      R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_PUBLIC_DOMAIN: ${{ secrets.R2_PUBLIC_DOMAIN }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 环境准备与 test job 共用同一个 composite action（唯一真相）。
      # 曾经这里是 5 个手写步骤、test job 又抄了一遍，导致两边漂移
      # （test 漏了 pip 依赖与 dex2c 解压，连续 5 次 CI 红）。
      # 出包不需要 nox 源码形态（只用 tools/nox.zip 的静态库），故 nox-source=false。
      - name: 准备工具链
        id: toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          # r27d 是默认值。2026-11-09 做过一次 r29 兼容性实验，结论：
          #   云端 r29 产物同样能跑（真机验证，业务页全对，进程稳定 32 分钟）。
          #   所以 r29 不是问题 —— 问题只在本地 Termux 环境（见下）。
          # 为什么仍用 r27d：
          #   · runner 预装 27.3.13750724，零下载（r29 要下 783MB，+约 40s）
          #   · tools/nox.zip 的 libnox.a 虽然是 r29(Amice bundle) 编的，
          #     但与 r27d 链接实测可用（跨版本混链未出问题）
          # 若要复现 r29：把下面改成 r29 即可（setup-ndk 映射表已支持）。
          #
          # ⚠️ 本地 Termux 用 r29 编出的 so 装机必 SIGILL（连纯 sigcheck 都崩），
          #    原因未查明。**本地装机测试的结论不可采信**，验证一律走云端。
          ndk-version: r27d
          nox-source: 'false'

      # ── Amice bundle（obfuscate 或 vmp 任一勾选时）───────────────────
      # 混淆与 VMP 都是编译期 LLVM pass，需要 bundle 里的 libamice.so +
      # host libLLVM.so。后者官方 NDK 不带（实测 find $NDK -name libLLVM* 为空），
      # 必须来自 bundle。
      #
      # 用 cache 与 amice-probe/amice-integrate 共用同一个 key —— 三个 job
      # 各自下载一次 848MB 是浪费；cache 命中后约 20 秒。
      #
      # 注意 PROTECT_OBF 的判定与 resolve-config 的解析**互相独立**：
      # 这里只是"要不要准备 bundle"，真正的参数由 protect.sh 从 args.txt 读。
      # 若两者不一致，protect.sh 会在找不到 bundle 时 fail-fast（不会静默）。
      #
      # ⚠️ 2026-11-11：判定条件从"只看 obfuscate"扩为"obfuscate 或 vmp"。
      #    漏掉 vmp 的后果：勾了 VMP 却没下 bundle → protect.sh 的
      #    resolve_amice_bundle 直接 exit 1 → 构建失败（这里还好，
      #    属于 fail-fast 不是假绿，但会浪费一轮 CI）。
      - name: 判定是否需要 Amice bundle（obfuscate 或 vmp）
        id: obf
        env:
          CFG: ${{ inputs.protect_config }}
        run: |
          set -euo pipefail
          # 用 python 解析而不是 grep：protect_config 是 JSON，
          # grep 'obfuscate' 会被 desc 里的中文或别的字段误命中。
          flag=$(python3 - <<'PY'
          import json, os
          try:
              d = json.loads(os.environ.get('CFG') or '{}')
          except Exception:
              print('false'); raise SystemExit
          ob = d.get('obfuscate')
          obf_on = bool(ob.get('enabled')) if isinstance(ob, dict) else bool(ob)
          vmp = d.get('vmp')
          vmp_on = bool(vmp.get('enabled')) if isinstance(vmp, dict) else bool(vmp)
          print('true' if (obf_on or vmp_on) else 'false')
          PY
          )
          echo "enabled=$flag" >> "$GITHUB_OUTPUT"
          echo "需要 Amice bundle（obfuscate 或 vmp）: $flag"

      - name: 取 Amice bundle（复用缓存）
        if: steps.obf.outputs.enabled == 'true'
        uses: actions/cache@v4
        with:
          path: ~/amice-bundle
          key: amice-r29-v0.1.6-nox1

      - name: 下载 Amice bundle（cache 未命中时）
        if: steps.obf.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          if [[ -f ~/amice-bundle/amice/lib/libamice.so ]]; then
            echo "OK: cache 命中"
            exit 0
          fi
          mkdir -p ~/amice-bundle && cd ~/amice-bundle
          URL=https://github.com/zzgs219G/amice/releases/download/v0.1.6-nox1/amice-android-ndk-r29-linux-x86_64.tar.gz
          curl -fL --retry 3 -o a.tar.gz "$URL"
          curl -fsSL -o a.sha256 "$URL.sha256"
          WANT=$(awk '{print $1}' a.sha256); GOT=$(sha256sum a.tar.gz | awk '{print $1}')
          [[ "$WANT" == "$GOT" ]] || { echo "sha256 不符 want=$WANT got=$GOT"; exit 1; }
          tar xzf a.tar.gz && rm -f a.tar.gz
          SRC=$(find . -maxdepth 1 -type d -name 'amice-android-ndk-*' | head -1)
          mv "$SRC"/* . && rmdir "$SRC"
          echo "OK: 解压完成"

      - name: 导出 Amice 环境变量供混淆使用
        if: steps.obf.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          # 写成 $GITHUB_ENV 让后续 protect.sh 那个 step 能读到。
          # 只导出路径；AMICE_MBA/FLATTEN 由 protect.sh 根据 args.txt 自行设置
          # （它才是知道用户勾了哪个子项的地方）。
          echo "AMICE_BUNDLE=$HOME/amice-bundle" >> "$GITHUB_ENV"
          echo "已导出 AMICE_BUNDLE=$HOME/amice-bundle"
          ls -la "$HOME/amice-bundle/amice/lib/" | head -3

      # ── 校验插件与 NDK 版本配套（缺这条会 SIGSEGV，不是普通报错）──────
      # 实测（run 42055440429）：用 NDK r27d 的 clang 18 加载 r29 插件
      # → exit code 139（clang frontend crashed）。
      # 插件按 LLVM 主版本编译，与 NDK clang 严格绑定，错配是未定义行为。
      - name: 校验 Amice bundle 的 NDK 与插件配套
        if: steps.obf.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          B="$HOME/amice-bundle"
          NDK_DIR=$(find "$B" -maxdepth 1 -type d -name 'android-ndk-*' | head -1)
          if [[ -z "$NDK_DIR" || ! -x "$NDK_DIR/ndk-build" ]]; then
            echo "FAIL: bundle 里没有自带的 NDK —— 插件无法安全加载"
            ls -la "$B" | head -10
            exit 1
          fi
          CLANG="$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
          echo "bundle NDK: $NDK_DIR"
          "$CLANG" --version | head -2
          # 交叉校验：bundle 的 NDK 主版本应与 bundle 名里的 -rXX 一致
          EXPECT_R=$(basename "$B" | grep -oE 'r[0-9]+' | head -1 || true)
          echo "bundle 名里的版本: ${EXPECT_R:-未知}"
          echo "✅ bundle 自带 NDK，插件配套"

      - name: 解析 protect_config（schema 驱动 → protect.sh 参数）
        env:
          # 经 env 中转，用户输入不直接插值进 shell（命令注入面，沿用旧 yml 思路）
          # input 键名 protect_config 为永久冻结名（设计方案 §10.7）
          INPUT_PROTECT_CONFIG: ${{ inputs.protect_config }}
        run: |
          # 观测性(2026-10-15 排查教训)：本次提交的配置原文/解析参数/规则内容必须进
          # build.log——否则失败排查时(如规则误填 ** 触发全量转译)对"实际提交了什么"
          # 一无所知，只能去网页翻 step 日志。env 中转照旧，内容仅 tee 进日志文件。
          touch build.log
          echo "=== 本次提交的 protect_config 原文 ===" | tee -a build.log
          echo "$INPUT_PROTECT_CONFIG" | tee -a build.log
          python3 scripts/actions/resolve-config.py 2>&1 | tee -a build.log
          {
            echo "=== args.txt（一行一个参数）==="
            cat schema_rules/args.txt
            for f in schema_rules/*.txt; do
              [[ "$f" == schema_rules/args.txt ]] && continue
              echo "=== $f ==="; cat "$f"
            done
          } | tee -a build.log

      # apksigner / zipalign 在 Android SDK build-tools 里，ubuntu runner 默认
      # 不装。用 setup-android 装一份并写进 PATH。
      #
      # ⚠️⚠️ 2026-11-08 由 `if: inputs.sign` 改为【无条件安装】。
      #    真事故（CI run 42435473015）：只勾 --packer 不勾 sign 时，
      #    build-tools 没装 → 没有 zipalign →
      #      protect.sh 的 finish_apk 跳过对齐（只 warn）→
      #      dpt 拿到未对齐包 → dpt 内部 zipalign 失败 →
      #      创建 0 字节 *_unsign.apk 但 java 返回 0 →
      #      上传 0 字节包，CI 仍 SUCCESS。
      #    zipalign 不只签名要，【加壳也要】—— dpt 的输入必须是已对齐的包。
      #    故无条件安装（体积约 50MB，setup-android 有缓存）。
      - name: 安装 Android build-tools（签名 + 加壳都需要 zipalign）
        uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;34.0.0'

      - name: 把 build-tools 加进 PATH（zipalign / apksigner）
        run: |
          set -o pipefail
          # setup-android 把工具装在 $ANDROID_HOME/build-tools/<ver>/ 下，
          # 但默认不在 PATH 里。后续步骤（protect.sh 的 finish_apk、
          # 加壳、签名）都要直接 `command -v zipalign` 能找到。
          BT=""
          for cand in "$ANDROID_HOME"/build-tools/*/; do
            if [[ -x "${cand}zipalign" ]]; then BT="$cand"; break; fi
          done
          if [[ -z "$BT" ]]; then
            echo "❌ build-tools 里找不到 zipalign —— 加壳与签名都会失效" | tee -a build.log
            ls "$ANDROID_HOME"/build-tools/ 2>/dev/null | tee -a build.log || true
            exit 1
          fi
          echo "$BT" >> "$GITHUB_PATH"
          echo "build-tools: $BT" | tee -a build.log
          "$BT/zipalign" 2>&1 | head -1 | tee -a build.log || true

      - name: 下载 APK
        timeout-minutes: 5
        env:
          # apk_url 同样经 env 中转：URL 直接插值进 bash 双引号可被 "$(...)" 逃逸
          # （安全审查 2026-09-18：protect_config 已中转，apk_url 补齐同一防线）
          APK_URL: ${{ inputs.apk_url }}
        run: |
          set -o pipefail
          # 报错四十四(2026-10-16): curl (3) URL rejected —— apk_url 含中文/空格
          # (文件名"简盒-正式版-...(1)_sign.apk")。curl 默认拒绝非 ASCII URL。
          # 修法: 下载前对 path/query 做百分号编码(scheme/host 保留,已编码的 %XX 不重复)。
          ENC_URL=$(APK_URL="$APK_URL" python3 -c 'import os, urllib.parse; u = os.environ["APK_URL"].strip(); p = urllib.parse.urlsplit(u); path = urllib.parse.quote(p.path, safe="/%:@"); query = urllib.parse.quote(p.query, safe="=&%:@") if p.query else ""; print(urllib.parse.urlunsplit((p.scheme, p.netloc, path, query, "")))')
          [ -n "$ENC_URL" ] || { echo "apk_url 为空" | tee -a build.log; exit 1; }
          echo "下载 URL(编码后): $ENC_URL" | tee -a build.log
          curl -fL --retry 3 -o app.apk "$ENC_URL" 2>&1 | tee -a build.log
          ls -la app.apk | tee -a build.log

      - name: 执行模块编排（固定顺序-签名校验-Dex2C-字符串加密-防对比混淆-环境检测-基础加壳）
        env:
          ANDROID_NDK_HOME: ${{ steps.toolchain.outputs.ndk-path }}
          # 通用 dpt 参数通道(报错四十三后方向调整):env 中转防注入,与 protect_config 同款
          INPUT_DPT_EXTRA_ARGS: ${{ inputs.dpt_extra_args }}
        run: |
          chmod +x scripts/pipelines/protect.sh
          # §10.2：读取时必须过滤空行（禁止直接 mapfile < args.txt）；
          # 一行一个参数 + "${ARGS[@]}" 引用展开，禁止空格分隔单行 + 无引号 $ARGS
          mapfile -t ARGS < <(grep -v '^$' schema_rules/args.txt)
          EXTRA_ARGS=()
          [[ -n "${INPUT_DPT_EXTRA_ARGS:-}" ]] && EXTRA_ARGS+=(--dpt-extra-args "$INPUT_DPT_EXTRA_ARGS")
          set -o pipefail
          ./scripts/pipelines/protect.sh app.apk protected_unsigned.apk "${ARGS[@]}" ${EXTRA_ARGS[@]+"${EXTRA_ARGS[@]}"} 2>&1 | tee -a build.log

      # ── 可选签名（默认关闭，保持"产物未签名"契约）───────────────────
      # 为什么做成可选而非默认：
      #   本仓库的既有契约是「产出未签名包，开发者自行重签」（见 AGENTS.md
      #   与流程文档 §2 步骤 11）。App 走默认路径时不应改变这个行为。
      #   但 CLI 调试时每次手工重签很烦（trigger_build.py 的诉求），
      #   所以给一个显式开关。
      #
      # ⚠️ 只接受 workflow input sign=true 触发，不接受 protect_config 里的
      #    字段：resolve-config.py 有白名单保险丝（未知顶层 key 直接 die），
      #    往 protect_config 加 sign 会让整个流程 fail-fast。
      #
      # ⚠️ 必须用【上传 APK 时那把 keystore】：加 --sigcheck 后 libnc.so 里
      #    写的是原证书的指纹，换证书重签 → 运行期证书派生失败 → 包起不来。
      #    （所以 secrets 里的 keystore 必须与用户上传的 APK 同源。）
      #
      # secrets 缺失时 fail-fast，不静默跳过 —— 否则用户以为签了，装上去
      # 还是"未签名，无法安装"。
      - name: 签名产物（可选）
        if: inputs.sign
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          missing=()
          [[ -n "$KEYSTORE_B64" ]] || missing+=("KEYSTORE_BASE64")
          [[ -n "$KS_PASS"      ]] || missing+=("KEYSTORE_PASSWORD")
          [[ -n "$KEY_ALIAS"    ]] || missing+=("KEY_ALIAS")
          [[ -n "$KEY_PASS"     ]] || missing+=("KEY_PASSWORD")
          if (( ${#missing[@]} > 0 )); then
            echo "❌ 请求了 sign=true 但缺少 Secrets: ${missing[*]}" | tee -a build.log
            echo "   存法见 docs/AI接手文档.md" | tee -a build.log
            exit 1
          fi

          # ── 定位 apksigner / zipalign ────────────────────────────────
          # setup-android 把它们装在 $ANDROID_HOME/build-tools/<ver>/ 下，
          # 但默认不在 PATH 里。显式找出目录加进 PATH，找不到就 fail-fast
          # （否则报 "apksigner: command not found" 而看不出是没装好）。
          BT=""
          for cand in "$ANDROID_HOME"/build-tools/*/; do
            if [[ -x "${cand}apksigner" ]]; then BT="$cand"; break; fi
          done
          if [[ -z "$BT" ]]; then
            echo "❌ 找不到 apksigner（build-tools 未安装？）" | tee -a build.log
            ls "$ANDROID_HOME"/build-tools/ 2>/dev/null | tee -a build.log || true
            exit 1
          fi
          export PATH="$BT:$PATH"
          echo "build-tools: $BT" | tee -a build.log

          # keystore 只落临时目录，跑完随 runner 销毁（不写 workspace，避免
          # 被 upload-artifact / 缓存意外带走）
          KS="$RUNNER_TEMP/release.keystore"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$KS"
          # 校验解出来是真 keystore（防 base64 截断/换行问题）
          keytool -list -keystore "$KS" -storepass "$KS_PASS" >/dev/null 2>&1 \
            || { echo "❌ keystore 解密失败：base64 或密码不对" | tee -a build.log; exit 1; }
          echo "✅ keystore 载入成功" | tee -a build.log

          # zipalign 必须在 apksigner 之前（apksigner 之后再对齐会破坏签名）
          aligned="$RUNNER_TEMP/aligned.apk"
          if command -v zipalign >/dev/null 2>&1; then
            zipalign -f -p 4 protected_unsigned.apk "$aligned" 2>&1 | tee -a build.log
          else
            echo "⚠ 无 zipalign，跳过对齐" | tee -a build.log
            cp protected_unsigned.apk "$aligned"
          fi

          apksigner sign \
            --ks "$KS" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KS_PASS" --key-pass "pass:$KEY_PASS" \
            --out protected_signed.apk "$aligned" 2>&1 | tee -a build.log

          apksigner verify --print-certs protected_signed.apk 2>&1 | tee -a build.log
          # 原产物改名，让下游"上传哪个文件"无歧义
          mv protected_unsigned.apk protected_unsigned_unsigned.apk
          mv protected_signed.apk protected_unsigned.apk
          echo "✅ 已签名（cert: $(apksigner verify --print-certs protected_unsigned.apk 2>/dev/null | grep 'SHA-256 digest' | head -1 | awk '{print $NF}')）" | tee -a build.log
          rm -f "$KS"

      - name: 上传加固包到 R2
        id: upload-r2
        run: |
          set -o pipefail
          # ⚠️⚠️ 2026-11-08 真事故：CI run 42435473015 把 0 字节 APK 传上了 R2，
          #    页面上显示"构建成功"。三重防线同时失效（dpt 不非零退出 /
          #    require_file 不查大小 / CI 无产物断言）。
          #    这里是最后一道：上传前必须验产物，否则前面的修复都可能被绕过。
          #    AGENTS.md 3.3 推论：不能只靠退出码，必须在产物上断言。
          if [[ ! -f protected_unsigned.apk ]]; then
            echo "❌ 产物不存在: protected_unsigned.apk" | tee -a build.log
            exit 1
          fi
          _sz=$(stat -c%s protected_unsigned.apk 2>/dev/null || echo 0)
          if [[ "${_sz:-0}" -lt 102400 ]]; then
            echo "❌ 产物过小（${_sz:-0} 字节 < 100 KB）—— 加壳或回编失败但流水线未报错" | tee -a build.log
            echo "   排查方向：dpt 日志有无 Zipalign failed / 回编是否产出空包" | tee -a build.log
            exit 1
          fi
          if ! unzip -l protected_unsigned.apk >/dev/null 2>&1; then
            echo "❌ 产物不是合法 zip/APK（${_sz} 字节）" | tee -a build.log
            exit 1
          fi
          echo "✅ 产物校验通过: ${_sz} 字节，zip 结构完好" | tee -a build.log
          if [[ -z "$R2_ENDPOINT" || -z "$R2_BUCKET" ]]; then
            echo "❌ R2_ENDPOINT/R2_BUCKET 为空，检查仓库 Secrets" | tee -a build.log
            exit 1
          fi
          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY"
          export AWS_SECRET_ACCESS_KEY="$R2_SECRET_KEY"
          export AWS_DEFAULT_REGION="auto"
          SAFE_NAME="${GITHUB_RUN_ID}_模块勾选包.apk"
          aws s3 cp protected_unsigned.apk "s3://$R2_BUCKET/apks/$SAFE_NAME" \
            --endpoint-url "$R2_ENDPOINT" --no-progress 2>&1 | tee -a build.log
          DL="$R2_PUBLIC_DOMAIN/apks/$SAFE_NAME"
          echo "download_url=$DL" >> "$GITHUB_OUTPUT"
          echo "🔗 下载地址: $DL" | tee -a build.log

      - name: 显示下载链接
        run: |
          echo "::notice title=📥 模块勾选加固包(未签名,请自行重签)::${{ steps.upload-r2.outputs.download_url }}"

      - name: 上传构建日志（无论成败都可下载）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 构建日志-build.log
          path: build.log
          if-no-files-found: warn
          retention-days: 1

      - name: Artifact 备用
        uses: actions/upload-artifact@v4
        with:
          name: 模块勾选加固包-未签名
          path: protected_unsigned.apk
          if-no-files-found: error
          retention-days: 1
