name: 'Setup toolchain (与出包 job 同一套环境)'
description: |
  APK 加固流水线与回归测试共用的环境准备：JDK 17 + NDK + dex2c 解压 +
  nox 解压 + python 依赖（+ 可选的 nox 源码）。

  【为什么必须抽成 action，而不是在两个 job 里各抄一遍】
  最初 test job 是照 protect job 手工抄环境步骤的，结果连续 5 次 CI 红，
  全部是"抄漏/抄错"造成的噪音：
    · 漏装 python 依赖 → ModuleNotFoundError: asn1crypto
    · 漏解压 dex2c     → 找不到 androguard
    · 抄了个不存在的 nox tag v0.4.2（真实最新是 v0.4.0）→ checkout 失败
  这些失败与代码质量毫无关系，只会让人逐渐无视红色 CI。
  抄一遍 = 制造第二份真相；唯一真相必须只有一份，两个 job 都 uses 它。

inputs:
  ndk-version:
    description: 'NDK 版本号（r27d / r26d）'
    required: false
    default: 'r27d'
  nox-source:
    description: |
      是否额外准备 nox【源码】形态（../nox）。so 层测试需要源码（grep 契约
      常量 + 真编译 .c），出包链路只需要 tools/nox.zip 的静态库形态。
    required: false
    default: 'false'
  nox-ref:
    description: |
      nox 源码的 git ref。默认 'main'——不写死 tag，因为 tag 会漂：
      曾凭 tools/nox/VERSION 里的 "v0.4.2" 想当然写成 ref: v0.4.2，
      而 nox 仓库根本没有该 tag（最新 v0.4.0），导致 checkout 失败。
      要锁定版本请显式传，且**先确认该 tag 真实存在**。
    required: false
    default: 'main'

outputs:
  ndk-path:
    description: 'NDK 根目录绝对路径'
    value: ${{ steps.ndk.outputs.ndk-path }}

runs:
  using: 'composite'
  steps:
    - name: 安装 JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 安装 Android NDK（优先预装，零下载）
      id: ndk
      uses: ./.github/actions/setup-ndk
      with:
        ndk-version: ${{ inputs.ndk-version }}

    # ── 把 NDK clang 加进 PATH（2026-11-22）──────────────────────────
    # 为什么需要：test-so-lock.sh / test-sig-guard2.sh 等宿主端测试直接调用
    # 裸 `clang` 编译 so，要靠 NDK 的 sysroot 才能找到 jni.h / android/log.h /
    # 并启用 arm_acle.h 的 ACLE intrinsics。
    #
    # ⚠️ 不加这一步的后果（2026-11-22 实测）：CI 会拿到系统 LLVM 18，报
    #     nc_guard_jni.c:18: fatal error: 'jni.h' file not found
    #     /usr/lib/llvm-18/.../arm_acle.h:21: "ACLE intrinsics support not enabled."
    #   而本地 Termux 有 NDK 的 include 路径，所以本地绿、CI 红。
    #
    # ⚠️ 这个 bug 潜伏了很久没被发现：test job 的这批 step 都有
    #    `if: steps.scope.outputs.code == 'true'`，只在改代码时跑。
    #    历史上多次推送只改文档（code=false）→ 整批被跳过 → 显示 success，
    #    但那是"跳过"不是"通过"。直到 2026-11-22 一次真改代码才暴露。
    #
    # prebuilt 目录名依宿主架构而异（linux-x86_64 / linux-aarch64），动态探测。
    - name: 让裸 clang 指向 NDK 的工具链（宿主测试用）
      shell: bash
      run: |
        set -o pipefail
        NDK="${{ steps.ndk.outputs.ndk-path }}"
        test -d "$NDK" || { echo "❌ NDK 目录不存在: $NDK"; exit 1; }

        # 找 prebuilt 目录（宿主架构决定名字：linux-x86_64 / linux-aarch64）
        BIN=""
        for cand in "$NDK"/toolchains/llvm/prebuilt/*/bin; do
          if [[ -x "${cand}/clang" ]]; then BIN="$cand"; break; fi
        done
        [[ -n "$BIN" ]] || { echo "❌ NDK 里找不到 clang"; ls "$NDK/toolchains/llvm/prebuilt/" 2>/dev/null; exit 1; }

        # ⚠️ 关键：NDK 的裸 clang【默认不带 Android sysroot】——
        #    实测 `echo '#include <jni.h>' | clang -x c -fsyntax-only -` 会失败，
        #    因为 jni.h/android/log.h 只在 sysroot 里，且 arm_acle.h 需要
        #    target 才启用 ACLE intrinsics。必须走【带 target 前缀的包装器】：
        #      aarch64-linux-android26-clang  ✅
        #      clang（裸）                     ❌ jni.h not found
        #    所以这里不放 BIN 进 PATH（那只会拿到裸 clang），而是造一个
        #    名为 clang 的转发脚本放到 PATH 最前面，把所有调用转给包装器。
        WRAP="$RUNNER_TEMP/ndk-clang"
        mkdir -p "$WRAP"
        ANDROID_CLANG="$(ls "$BIN"/aarch64-linux-android[0-9]*-clang 2>/dev/null | sort -V | head -1)"
        [[ -n "$ANDROID_CLANG" ]] || { echo "❌ 找不到 aarch64-linux-android*-clang: $BIN"; ls "$BIN" | grep -i clang | head; exit 1; }

        # 宿主测试产物是跑在本机跑不起来的（测试只用 ELF 解析/符号检查），
        # 所以固定 arm64 target 与生产一致即可。
        for name in clang clang++; do
          cat > "$WRAP/$name" <<WRAPEOF
        #!/usr/bin/env bash
        # 自动生成：把裸 $name 转发给 NDK 的 target 包装器。
        # 目的：test-so-lock.sh 等宿主测试写的是裸 clang，需要 Android sysroot。
        exec "$ANDROID_CLANG" "\$@"
        WRAPEOF
          chmod +x "$WRAP/$name"
        done
        echo "$WRAP" >> "$GITHUB_PATH"
        echo "clang → $ANDROID_CLANG"

        # 立即验证（否则要等具体测试失败才发现，排查成本高）
        export PATH="$WRAP:$PATH"
        for h in jni.h android/log.h; do
          echo "#include <$h>" | clang -x c -fsyntax-only - \
            || { echo "❌ 转发后的 clang 找不到 $h"; exit 1; }
        done
        echo "✔ 裸 clang 已可编 Android 头（jni.h / android/log.h 验证通过）"

    - name: 解压 dex2c 分发包
      shell: bash
      run: |
        unzip -qo tools/dex2c.zip -d tools
        test -f tools/Dex2C/dcc.py || { echo "❌ dex2c.zip 解压产物异常"; exit 1; }

    - name: 解压 nox 分发包（so 段加密设施，静态库形态）
      shell: bash
      run: |
        # 上游 nox 仓库是 so 加密设施的【唯一真相源】，本仓库不再保存源码副本。
        # tools/nox.zip 是生产用的静态库形态（*.h + *.py + lib/<abi>/libnox.a）。
        # zip 内顶层是 nox/，解压到 tools/。protect.sh 入口的 ensure_nox 也会
        # 幂等解压，此处提前做是为了让"包损坏/顶层目录名漂移"尽早炸。
        unzip -qo tools/nox.zip -d tools
        test -f tools/nox/so-guard/nc_guard_layout.h \
          || { echo "❌ nox.zip 缺契约头文件 nc_guard_layout.h"; exit 1; }
        test -f tools/nox/so-guard/lib/arm64-v8a/libnox.a \
          || { echo "❌ nox.zip 缺 arm64-v8a 静态库"; exit 1; }
        test -f tools/nox/so-guard/lib/armeabi-v7a/libnox.a \
          || { echo "❌ nox.zip 缺 armeabi-v7a 静态库"; exit 1; }
        # 反向断言：生产包不得含 C 源码（静态库形态核心契约）
        BAD=$(find tools/nox/so-guard -maxdepth 1 -name '*.c' 2>/dev/null || true)
        [ -z "$BAD" ] || { echo "❌ nox.zip 含 C 源码（应为静态库形态）: $BAD"; exit 1; }
        echo "✔ nox 生产包（静态库形态）已就位"

    - name: 安装 python 依赖
      shell: bash
      run: pip3 install -r tools/Dex2C/requirements.txt

    # ── 可选：nox 源码形态（仅 so 层测试需要）──────────────────────
    # 测试脚本的 ensure_nox_src 认 <repo>/../nox/scripts/so-guard，
    # 而 actions/checkout 的 path 不允许 `../`（会报 "is not under ..."），
    # 所以先 clone 到仓库内 .nox-tmp 再 mv 出去。
    - name: 检出 nox 源码
      if: inputs.nox-source == 'true'
      uses: actions/checkout@v4
      with:
        repository: zzgs219G/nox
        ref: ${{ inputs.nox-ref }}
        path: .nox-tmp
        fetch-depth: 1

    - name: 把 nox 源码放到同级目录
      if: inputs.nox-source == 'true'
      shell: bash
      run: |
        mv .nox-tmp ../nox
        test -f ../nox/scripts/so-guard/nc_guard_boot.c \
          || { echo "❌ nox 源码未就位（so 层测试需要 .c 形态）"; exit 1; }
        echo "✔ nox 源码已就位（ref=${{ inputs.nox-ref }}）"
        echo "  so-guard: $(ls ../nox/scripts/so-guard/*.c | wc -l) 个 .c"
