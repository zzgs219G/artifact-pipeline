name: 'Setup toolchain (与出包 job 同一套环境)'
description: |
  APK 加固流水线与回归测试共用的环境准备：JDK 17 + NDK + dex2c 解压 +
  nox 解压 + python 依赖（+ 可选的 nox 源码）。

  【为什么必须抽成 action，而不是在两个 job 里各抄一遍】
  最初 test job 是照 protect job 手工抄环境步骤的，结果连续 5 次 CI 红，
  全部是"抄漏/抄错"造成的噪音：
    · 漏装 python 依赖 → ModuleNotFoundError: asn1crypto
    · 漏解压 dex2c     → 找不到 androguard
    · 抄了个不存在的 nox tag v0.4.2（真实最新是 v0.4.0）→ checkout 失败
  这些失败与代码质量毫无关系，只会让人逐渐无视红色 CI。
  抄一遍 = 制造第二份真相；唯一真相必须只有一份，两个 job 都 uses 它。

inputs:
  ndk-version:
    description: 'NDK 版本号（r27d / r26d）'
    required: false
    default: 'r27d'
  nox-source:
    description: |
      是否额外准备 nox【源码】形态（../nox）。so 层测试需要源码（grep 契约
      常量 + 真编译 .c），出包链路只需要 tools/nox.zip 的静态库形态。
    required: false
    default: 'false'
  nox-ref:
    description: |
      nox 源码的 git ref。默认 'main'——不写死 tag，因为 tag 会漂：
      曾凭 tools/nox/VERSION 里的 "v0.4.2" 想当然写成 ref: v0.4.2，
      而 nox 仓库根本没有该 tag（最新 v0.4.0），导致 checkout 失败。
      要锁定版本请显式传，且**先确认该 tag 真实存在**。
    required: false
    default: 'main'

outputs:
  ndk-path:
    description: 'NDK 根目录绝对路径'
    value: ${{ steps.ndk.outputs.ndk-path }}

runs:
  using: 'composite'
  steps:
    - name: 安装 JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 安装 Android NDK（优先预装，零下载）
      id: ndk
      uses: ./.github/actions/setup-ndk
      with:
        ndk-version: ${{ inputs.ndk-version }}

    - name: 解压 dex2c 分发包
      shell: bash
      run: |
        unzip -qo tools/dex2c.zip -d tools
        test -f tools/Dex2C/dcc.py || { echo "❌ dex2c.zip 解压产物异常"; exit 1; }

    - name: 解压 nox 分发包（so 段加密设施，静态库形态）
      shell: bash
      run: |
        # 上游 nox 仓库是 so 加密设施的【唯一真相源】，本仓库不再保存源码副本。
        # tools/nox.zip 是生产用的静态库形态（*.h + *.py + lib/<abi>/libnox.a）。
        # zip 内顶层是 nox/，解压到 tools/。protect.sh 入口的 ensure_nox 也会
        # 幂等解压，此处提前做是为了让"包损坏/顶层目录名漂移"尽早炸。
        unzip -qo tools/nox.zip -d tools
        test -f tools/nox/so-guard/nc_guard_layout.h \
          || { echo "❌ nox.zip 缺契约头文件 nc_guard_layout.h"; exit 1; }
        test -f tools/nox/so-guard/lib/arm64-v8a/libnox.a \
          || { echo "❌ nox.zip 缺 arm64-v8a 静态库"; exit 1; }
        test -f tools/nox/so-guard/lib/armeabi-v7a/libnox.a \
          || { echo "❌ nox.zip 缺 armeabi-v7a 静态库"; exit 1; }
        # 反向断言：生产包不得含 C 源码（静态库形态核心契约）
        BAD=$(find tools/nox/so-guard -maxdepth 1 -name '*.c' 2>/dev/null || true)
        [ -z "$BAD" ] || { echo "❌ nox.zip 含 C 源码（应为静态库形态）: $BAD"; exit 1; }
        echo "✔ nox 生产包（静态库形态）已就位"

    - name: 安装 python 依赖
      shell: bash
      run: pip3 install -r tools/Dex2C/requirements.txt

    # ── 可选：nox 源码形态（仅 so 层测试需要）──────────────────────
    # 测试脚本的 ensure_nox_src 认 <repo>/../nox/scripts/so-guard，
    # 而 actions/checkout 的 path 不允许 `../`（会报 "is not under ..."），
    # 所以先 clone 到仓库内 .nox-tmp 再 mv 出去。
    - name: 检出 nox 源码
      if: inputs.nox-source == 'true'
      uses: actions/checkout@v4
      with:
        repository: zzgs219G/nox
        ref: ${{ inputs.nox-ref }}
        path: .nox-tmp
        fetch-depth: 1

    - name: 把 nox 源码放到同级目录
      if: inputs.nox-source == 'true'
      shell: bash
      run: |
        mv .nox-tmp ../nox
        test -f ../nox/scripts/so-guard/nc_guard_boot.c \
          || { echo "❌ nox 源码未就位（so 层测试需要 .c 形态）"; exit 1; }
        echo "✔ nox 源码已就位（ref=${{ inputs.nox-ref }}）"
        echo "  so-guard: $(ls ../nox/scripts/so-guard/*.c | wc -l) 个 .c"
